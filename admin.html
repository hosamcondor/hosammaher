<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>
:root{--bg:#f3f5f8;--s:#fff;--t:#14212e;--m:#5d6b7a;--l:#dde3ea;--navy:#0b2a45;--a:#f2a900}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 system-ui,sans-serif}
.card{max-width:380px;margin:12vh auto;background:var(--s);border:1px solid var(--l);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:12px}
h1,h2{margin:0}input,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:vertical}
.btn{display:inline-block;background:var(--a);color:#1a1400;border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sm{padding:6px 14px;font-size:.9rem}.btn.danger{background:#fee2e2;color:#991b1b}.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
#err{color:#b91c1c;margin:0;min-height:1.2em}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.bar b{margin-inline-end:auto}#st{font-size:.9rem;color:#cfe}
main{max-width:820px;margin:0 auto;padding:20px}
section{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:20px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
label.f{font-weight:600;font-size:.88rem;color:var(--m);display:flex;flex-direction:column;gap:4px}
.ph{display:flex;gap:16px;align-items:center}.ph img{width:110px;height:138px;object-fit:cover;border-radius:10px}.noimg{width:110px;height:138px;border-radius:10px;background:var(--l);display:flex;align-items:center;justify-content:center;color:var(--m);font-size:.85rem}
.proj{border:1px solid var(--l);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.th{display:flex;gap:8px;flex-wrap:wrap}.th span{position:relative}.th img{width:90px;height:62px;object-fit:cover;border-radius:6px}
.th button{position:absolute;top:-6px;right:-6px;border:0;background:#111;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}
.rw{display:flex;gap:10px;justify-content:space-between}
[hidden]{display:none!important}
</style></head><body>
<div id="login" class="card"><h1>Admin login</h1>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn" id="go">Sign in</button><p id="err"></p></div>
<div id="ed" hidden>
<div class="bar"><b>Site admin</b><span id="st"></span><span id="who"></span><a class="btn sm ghost" href="./" target="_blank">View site</a><button class="btn sm ghost" id="out">Sign out</button><button class="btn sm" id="save">Save &amp; publish</button></div>
<main id="body"></main></div>
<script src="default-data.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,collection} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okId=i=>/^[A-Za-z0-9]{10,40}$/.test(i);
const status=m=>{$('st').textContent=m};
let auth,db,DATA,PH={},trash=[];
var FIELDS=[['name','Name','line'],['title','Title (top bar)','line'],['bio','About / summary','text'],['links','Contact links: one per line, Label | URL','links'],['services','What I do: one per line, Title | Description','svc'],['experience','Experience: separate jobs with a blank line. First line: Role | Company | Period, then lines starting with "- " for bullets','blocks'],['education','Education: same format as Experience','blocks'],['skills','Technical skills: one per line','list'],['certs','Certifications: one per line','list'],['languages','Languages: one per line','list'],['info','Additional information: one per line','list']];
function toText(v,t){
  if(t==='line'||t==='text') return v||'';
  if(t==='list') return (v||[]).join('\n');
  if(t==='links') return (v||[]).map(function(l){return l.label+' | '+l.url}).join('\n');
  if(t==='svc') return (v||[]).map(function(s){return s.t+' | '+s.d}).join('\n');
  return (v||[]).map(function(x){return [x.role+' | '+x.org+' | '+x.period].concat(x.desc?[x.desc]:[],(x.points||[]).map(function(p){return '- '+p})).join('\n')}).join('\n\n');
}
function lines(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function pair(l){var i=l.indexOf('|');return i<0?[l,'']:[l.slice(0,i).trim(),l.slice(i+1).trim()]}
function fromText(s,t){
  if(t==='line'||t==='text') return s.trim();
  if(t==='list') return lines(s);
  if(t==='links') return lines(s).map(pair).filter(function(p){return /^(https?:|mailto:|tel:)/i.test(p[1])}).map(function(p){return {label:p[0]||p[1],url:p[1]}});
  if(t==='svc') return lines(s).map(pair).map(function(p){return {t:p[0],d:p[1]}});
  return s.split(/\n\s*\n/).map(lines).filter(function(b){return b.length}).map(function(b){var h=b[0].split('|').map(function(x){return x.trim()}),pts=[],ds=[];b.slice(1).forEach(function(l){/^[-•]\s*/.test(l)?pts.push(l.replace(/^[-•]\s*/,'')):ds.push(l)});return {role:h[0],org:h[1]||'',period:h[2]||'',desc:ds.join(' '),points:pts}});
}

if(!firebaseConfig.apiKey||firebaseConfig.apiKey.indexOf('YOUR_')===0){$('err').textContent='Fill in firebase-config.js first.'}
else{auth=getAuth(initializeApp(firebaseConfig));db=getFirestore(auth.app)}
async function loadPhotos(){
  const ids=[DATA.photo].concat(...DATA.projects.map(p=>p.images||[])).filter(i=>okId(i)&&!PH[i]);
  await Promise.all([...new Set(ids)].map(async id=>{try{const r=await getDoc(doc(db,'photos',id));if(r.exists())PH[id]=r.data().data}catch(e){}}));
}
async function load(){
  const s=await getDoc(doc(db,'site','main'));
  DATA=Object.assign(JSON.parse(JSON.stringify(window.DEFAULT_DATA)),s.exists()&&s.data().json?JSON.parse(s.data().json):{});
  await loadPhotos();
}
function shrink(file,max=1200){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>900000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}URL.revokeObjectURL(u);res(d)};
  im.onerror=()=>rej(new Error('bad image'));im.src=u})}
async function upload(file){const d=await shrink(file);const r=await addDoc(collection(db,'photos'),{data:d});PH[r.id]=d;return r.id}
function collect(){
  FIELDS.forEach((f,i)=>{const el=$('f'+i);if(!el)return;const v=fromText(el.value,f[2]);if(f[0]==='name'&&!v)return;DATA[f[0]]=v});
  DATA.projects.forEach((p,i)=>{const t=$('pt'+i);if(!t)return;p.title=t.value.trim()||'Untitled';p.desc=$('pd'+i).value.trim();p.tags=$('pg'+i).value.split(/[,،]/).map(x=>x.trim()).filter(Boolean)});
}
function draw(){
  const d=DATA;
  $('body').innerHTML=
  `<section><h2>Profile photo</h2><div class="ph">${okId(d.photo)&&PH[d.photo]?`<img src="${PH[d.photo]}">`:'<div class="noimg">No photo</div>'}<label class="btn">Choose photo<input type="file" id="photo" accept="image/*" hidden></label></div></section>`
  +`<section><h2>Content</h2>${FIELDS.map((f,i)=>`<label class="f">${esc(f[1])}${f[2]==='line'?`<input id="f${i}" value="${esc(toText(d[f[0]],f[2]))}">`:`<textarea id="f${i}" rows="${f[2]==='blocks'?10:f[2]==='text'?5:4}">${esc(toText(d[f[0]],f[2]))}</textarea>`}</label>`).join('')}</section>`
  +`<section><h2>Projects</h2><div><button class="btn" id="addp">＋ Add project</button></div>${d.projects.map((p,i)=>`<div class="proj"><input id="pt${i}" value="${esc(p.title)}" placeholder="Project name"><textarea id="pd${i}" rows="3" placeholder="Description">${esc(p.desc)}</textarea><input id="pg${i}" value="${esc((p.tags||[]).join(', '))}" placeholder="Tags, comma separated"><div class="th">${(p.images||[]).map((id,j)=>PH[id]?`<span><img src="${PH[id]}"><button data-rm="${i}:${j}">×</button></span>`:'').join('')}</div><div class="rw"><label class="btn sm">＋ Photos<input type="file" multiple accept="image/*" hidden data-add="${i}"></label><button class="btn sm danger" data-del="${i}">Delete project</button></div></div>`).join('')}</section>`;
  $('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;collect();status('Uploading photo…');
    try{const id=await upload(f);if(okId(DATA.photo))trash.push(DATA.photo);DATA.photo=id;status('Photo added. Press Save to publish.')}catch(x){status('Upload failed')}draw()};
  $('addp').onclick=()=>{collect();DATA.projects.unshift({id:'p'+Date.now(),title:'New project',desc:'',tags:[],images:[]});draw()};
  document.querySelectorAll('[data-add]').forEach(inp=>inp.onchange=async()=>{collect();const p=DATA.projects[+inp.dataset.add];status('Uploading…');
    try{for(const f of inp.files)p.images=(p.images||[]).concat(await upload(f));status('Photos added. Press Save to publish.')}catch(x){status('Upload failed')}draw()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{collect();const [i,j]=b.dataset.rm.split(':').map(Number);trash.push(DATA.projects[i].images[j]);DATA.projects[i].images.splice(j,1);draw()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this project?'))return;collect();const p=DATA.projects.splice(+b.dataset.del,1)[0];(p.images||[]).forEach(id=>trash.push(id));draw()});
}
if(auth){
  $('go').onclick=async()=>{$('err').textContent='';try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){$('err').textContent='Wrong email or password.'}};
  $('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
  $('out').onclick=()=>signOut(auth);
  $('save').onclick=async()=>{collect();status('Saving…');
    try{await setDoc(doc(db,'site','main'),{json:JSON.stringify(DATA),updatedAt:Date.now()});
      for(const id of trash){try{await deleteDoc(doc(db,'photos',id))}catch(e){}}trash=[];status('Saved. The site is updated.')}
    catch(e){status('Save failed: '+(e.code||e.message))}};
  onAuthStateChanged(auth,async u=>{$('login').hidden=!!u;$('ed').hidden=!u;
    if(u){$('who').textContent=u.email;status('Loading…');try{await load();draw();status('')}catch(e){status('Could not load: '+(e.code||e.message))}}});
}
</script></body></html>
